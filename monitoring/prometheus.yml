global:
  scrape_interval: 15s

scrape_configs:
  - job_name: pipeline
    static_configs:
      - targets:
          - producer:9101
          - source2:9102
          - aggregator:9103
          - spark:9104
          - metrics:9105
  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]
