services:
  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka_data:/tmp/kraft-combined-logs

  postgres:
    image: postgres:16-alpine
    container_name: audit-cartographie-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: transport_velo
      POSTGRES_USER: audit_user
      POSTGRES_PASSWORD: audit_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/sql/postgresql_schema.sql:/docker-entrypoint-initdb.d/01_postgresql_schema.sql:ro
      - ./database/sql/tp2_schema.sql:/docker-entrypoint-initdb.d/02_tp2_schema.sql:ro
      - ./data/pc_captv_p.csv:/docker-entrypoint-initdb.d/pc_captv_p.csv:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U audit_user -d transport_velo" ]
      interval: 5s
      timeout: 5s
      retries: 20

  source2:
    build: ./pipeline
    command: python source2.py
    volumes:
      - ./data:/source-data:ro
      - datalake_data:/data-lake
    ports:
      - "9102:9102"
    restart: unless-stopped

  producer:
    build: ./pipeline
    command: python producer.py
    depends_on:
      - kafka
    environment:
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC: weather.bordeaux
      POLL_INTERVAL_SECONDS: 30
    ports:
      - "9101:9101"
    restart: unless-stopped

  aggregator:
    build: ./pipeline
    command: python aggregator.py
    depends_on:
      - kafka
      - source2
    environment:
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC: weather.bordeaux
    volumes:
      - datalake_data:/data-lake
    ports:
      - "9103:9103"
    restart: unless-stopped

  spark:
    build: ./spark
    command: /opt/spark/bin/spark-submit /opt/spark/jobs/spark_job.py
    depends_on:
      postgres:
        condition: service_healthy
      aggregator:
        condition: service_started
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: transport_velo
      POSTGRES_USER: audit_user
      POSTGRES_PASSWORD: audit_password
    volumes:
      - datalake_data:/data-lake
    ports:
      - "9104:9104"
    restart: unless-stopped

  metrics:
    build: ./pipeline
    command: python metrics.py
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: transport_velo
      POSTGRES_USER: audit_user
      POSTGRES_PASSWORD: audit_password
    volumes:
      - datalake_data:/data-lake:ro
    ports:
      - "9105:9105"
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: postgresql://audit_user:audit_password@postgres:5432/transport_velo?sslmode=disable
    ports:
      - "9187:9187"

  prometheus:
    image: prom/prometheus:v2.53.0
    depends_on:
      - producer
      - source2
      - aggregator
      - spark
      - metrics
      - postgres-exporter
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.1.0
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"

  metabase:
    image: metabase/metabase:v0.50.26
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase_data:/metabase-data
    ports:
      - "3001:3000"

volumes:
  kafka_data:
  postgres_data:
  datalake_data:
  prometheus_data:
  grafana_data:
  metabase_data:
